<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Pro Firebase</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background:#eef2f7;
  margin:0;
}

.navbar {
  background:#007bff;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container {
  padding:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input, select {
  width:100%;
  padding:10px;
  margin:5px 0;
}

button {
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.btn { background:#007bff; color:white; }
.grid { display:flex; flex-wrap:wrap; gap:15px; }

.product {
  width:180px;
  background:white;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.product img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="navbar">Toko Online Pro</div>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h3>Login Admin</h3>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="card">
<h3>Tambah Produk</h3>
<input id="nama" placeholder="Nama">
<input id="harga" type="number" placeholder="Harga PCS">
<input id="stok" type="number" placeholder="Stok PCS">
<input id="pack" type="number" placeholder="1 Pack = ? PCS">
<input id="crt" type="number" placeholder="1 CRT = ? PCS">
<input type="file" id="foto">
<button class="btn" onclick="tambah()">Simpan</button>
</div>

<h3>Produk</h3>
<div id="list" class="grid"></div>

</div>

</div>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyBYkPd9KaoJoSEAhO2BsVz8P76GnNJuVnY",
  authDomain: "smarttoko-cfa75.firebaseapp.com",
  projectId: "smarttoko-cfa75",
  storageBucket: "smarttoko-cfa75.firebasestorage.app",
  messagingSenderId: "408497647205",
  appId: "1:408497647205:web:cedd0b3ec9775c4897e08c",
  measurementId: "G-PV0T28BK91"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* LOGIN */
function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
  .then(()=>{
    document.getElementById("loginBox").style.display="none";
    document.getElementById("app").style.display="block";
    loadProduk();
  })
  .catch(e=>alert(e.message));
}

/* LOAD PRODUK REALTIME */
function loadProduk(){
  db.collection("produk").onSnapshot(res=>{
    let el = document.getElementById("list");
    el.innerHTML="";

    res.forEach(doc=>{
      let p = doc.data();

      el.innerHTML += `
      <div class="product">
        <img src="${p.foto}">
        <h4>${p.nama}</h4>
        <p>Stok: ${p.stok}</p>
        <p>Rp ${p.harga}</p>
      </div>
      `;
    });
  });
}

/* TAMBAH */
function tambah(){
  let nama = document.getElementById("nama").value;
  let harga = +document.getElementById("harga").value;
  let stok = +document.getElementById("stok").value;
  let pack = +document.getElementById("pack").value || 1;
  let crt = +document.getElementById("crt").value || 1;
  let file = document.getElementById("foto").files[0];

  let reader = new FileReader();
  reader.onload = e=>{
    db.collection("produk").add({
      nama, harga, stok, pack, crt,
      foto:e.target.result
    });
  };
  reader.readAsDataURL(file);
}
</script>

</body>
</html>
