<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVI STORE</title>

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;}
.header{background:#25D366;color:white;padding:15px;text-align:center;font-weight:bold;}

.container{padding:15px;}
.hidden{display:none;}

input{
  width:100%;padding:10px;margin:5px 0;
  border-radius:8px;border:1px solid #ccc;
}

button{
  width:100%;padding:10px;margin:5px 0;
  border:none;border-radius:8px;
  background:#25D366;color:white;font-weight:bold;
}

.menu{display:flex;gap:10px;}
.menu button{flex:1;}

.card{
  background:white;padding:10px;margin:10px 0;
  border-radius:10px;
}

img{width:100%;max-width:120px;}

.qty{display:flex;gap:5px;align-items:center;}
.qty button{width:30px;height:30px;padding:0;}
</style>
</head>

<body>

<div class="header">EVI STORE</div>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button onclick="register()">DAFTAR</button>
</div>

<!-- INPUT -->
<div id="inputPage" class="hidden">
<h3>Menu Input</h3>

<input id="nama" placeholder="Nama Produk">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">
<input type="file" id="foto">

<button onclick="upload()">Simpan Produk</button>

<div class="menu">
<button onclick="showCatalog()">CATALOG</button>
<button onclick="logout()">LOGOUT</button>
</div>

<div id="notif"></div>
</div>

<!-- CATALOG -->
<div id="catalogPage" class="hidden">

<h3>Catalog</h3>

<button onclick="backToInput()">⬅ Kembali</button>

<div id="catalog"></div>

<h3>Keranjang</h3>
<div id="cart"></div>

<button onclick="checkout()">CHECKOUT / SHARE WA</button>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.firebasestorage.app",
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let user=null;
let cartData={};

// AUTH STATE
onAuthStateChanged(auth,(u)=>{
  user=u;
  if(u){
    loginPage.classList.add("hidden");
    inputPage.classList.remove("hidden");
  }else{
    loginPage.classList.remove("hidden");
    inputPage.classList.add("hidden");
    catalogPage.classList.add("hidden");
  }
});

// LOGIN
window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));

window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));

window.logout=()=>signOut(auth);

// UPLOAD PRODUK (FIX BUG)
window.upload=async()=>{
  try{
    if(!nama.value || !harga.value || !stok.value){
      return notif.innerHTML="⚠️ Lengkapi semua data";
    }

    if(!foto.files[0]){
      return notif.innerHTML="⚠️ Pilih foto dulu";
    }

    notif.innerHTML="⏳ Uploading...";

    const file=foto.files[0];
    const storageRef=ref(storage,"produk/"+Date.now());

    await uploadBytes(storageRef,file);
    const url=await getDownloadURL(storageRef);

    await addDoc(collection(db,"produk"),{
      nama:nama.value,
      harga:Number(harga.value),
      stok:Number(stok.value),
      foto:url,
      userId:user.uid
    });

    notif.innerHTML="✅ Produk berhasil disimpan";

    nama.value="";
    harga.value="";
    stok.value="";
    foto.value="";

  }catch(e){
    notif.innerHTML="❌ Error: "+e.message;
  }
};

// NAV
window.showCatalog=()=>{
  inputPage.classList.add("hidden");
  catalogPage.classList.remove("hidden");
  loadCatalog();
};

window.backToInput=()=>{
  catalogPage.classList.add("hidden");
  inputPage.classList.remove("hidden");
};

// LOAD CATALOG
async function loadCatalog(){
  const snap=await getDocs(collection(db,"produk"));

  let html="";
  snap.forEach(doc=>{
    const p=doc.data();
    const id=doc.id;

    html+=`
    <div class="card">
      <img src="${p.foto}">
      <b>${p.nama}</b><br>
      Rp ${p.harga}<br>

      <div class="qty">
        <button onclick="min('${id}')">-</button>
        <span id="q_${id}">0</span>
        <button onclick="add('${id}','${p.nama}',${p.harga})">+</button>
      </div>
    </div>`;
  });

  catalog.innerHTML=html;
}

// CART
window.add=(id,nama,harga)=>{
  if(!cartData[id]) cartData[id]={nama,qty:0,harga};
  cartData[id].qty++;
  updateCart();
};

window.min=(id)=>{
  if(cartData[id]){
    cartData[id].qty--;
    if(cartData[id].qty<=0) delete cartData[id];
  }
  updateCart();
};

function updateCart(){
  let html="",total=0;

  for(let id in cartData){
    let i=cartData[id];
    total+=i.qty*i.harga;

    let el=document.getElementById("q_"+id);
    if(el) el.innerText=i.qty;

    html+=`${i.nama} x${i.qty}<br>`;
  }

  html+=`<hr>Total: Rp ${total}`;
  cart.innerHTML=html;
}

// CHECKOUT WA
window.checkout=()=>{
  if(Object.keys(cartData).length===0){
    return alert("Keranjang kosong");
  }

  let text="Pesanan:%0A";

  for(let id in cartData){
    let i=cartData[id];
    text+=`${i.nama} x${i.qty}%0A`;
  }

  let wa="6282285712293";
  window.open(`https://wa.me/${wa}?text=${text}`);
};
</script>

</body>
</html>
