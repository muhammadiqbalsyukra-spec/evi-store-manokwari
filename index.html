<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVI STORE MANOKWARI</title>

<style>
body{font-family:sans-serif;background:#f4f6fb;margin:0;}
.navbar{background:#1e88e5;color:#fff;padding:15px;text-align:center;font-weight:bold;}
.container{padding:15px;max-width:900px;margin:auto;}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;}

input,select,button{
width:100%;padding:10px;margin:5px 0;border-radius:6px;border:1px solid #ccc;
}

button{background:#1e88e5;color:#fff;border:none;cursor:pointer;}
.btn-danger{background:#e53935;}
.btn-warning{background:#fb8c00;}
.btn-share{background:#43a047;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}

.product{background:#fff;padding:10px;border-radius:8px;text-align:center;}
.product img{width:100%;height:120px;object-fit:cover;border-radius:6px;}

.preview{width:100%;max-height:200px;object-fit:contain;background:#eee;margin-top:5px;}

.cart-item{display:flex;justify-content:space-between;background:#f1f1f1;padding:5px;border-radius:6px;margin:5px 0;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="navbar" id="judulToko">EVI STORE</div>

<div class="container">

<button class="btn-share" onclick="shareCatalog()">🔗 Share Catalog</button>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h3>Login Admin</h3>
<input id="email">
<input id="password" type="password">
<button onclick="login()">Login</button>
</div>

<div id="appBox" style="display:none">

<!-- PROFIL TOKO -->
<div class="card">
<h3>Profil Toko</h3>
<input id="namaToko" placeholder="Nama Toko">
<input id="noWA" placeholder="No WhatsApp (628...)">
<button onclick="simpanToko()">Simpan Profil</button>
</div>

<!-- FORM -->
<div class="card" id="formBox">
<h3>Tambah Produk</h3>
<input id="nama" placeholder="Nama">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Jumlah">

<select id="satuan">
<option value="pcs">PCS</option>
<option value="pack">PACK</option>
<option value="crt">CRT</option>
</select>

<input id="pack" placeholder="1 Pack = PCS">
<input id="crt" placeholder="1 CRT = PCS">

<input type="file" id="foto">
<img id="preview" class="preview">

<button onclick="tambah()">Simpan Produk</button>
<button onclick="resetForm()" class="btn-warning">Reset</button>
</div>

<!-- CATALOG -->
<div class="card">
<h3>Catalog Produk</h3>
<div id="list" class="grid"></div>
</div>

<!-- CART -->
<div class="card">
<h3>Keranjang 🛒</h3>
<div id="cartList"></div>
<h4 id="totalHarga">Total: Rp 0</h4>
<button onclick="checkoutCart()">Checkout</button>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.firebasestorage.app",
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let uid=null;
let editId=null;
let cart=[];
let tokoData=null;

const isPublic = new URLSearchParams(location.search).get("view")==="public";

/* LOGIN */
window.login = async ()=>{
  await signInWithEmailAndPassword(auth,email.value,password.value);
};

/* AUTH */
onAuthStateChanged(auth, async u=>{
  if(!u) return;
  uid=u.uid;

  loginBox.style.display="none";
  appBox.style.display="block";

  await initToko();
  loadProduk();
});

/* INIT TOKO */
async function initToko(){
  const refToko = doc(db,"toko",uid);
  const snap = await getDoc(refToko);

  if(!snap.exists()){
    await setDoc(refToko,{
      namaToko:"Toko Baru",
      noWA:"6280000000000",
      owner:auth.currentUser.email
    });
  }

  tokoData = (await getDoc(refToko)).data();

  namaToko.value = tokoData.namaToko;
  noWA.value = tokoData.noWA;

  judulToko.innerText = tokoData.namaToko;
}

/* SIMPAN TOKO */
window.simpanToko = async ()=>{
  await updateDoc(doc(db,"toko",uid),{
    namaToko:namaToko.value,
    noWA:noWA.value
  });
  alert("Profil disimpan");
  initToko();
};

/* SHARE */
window.shareCatalog=()=>{
  let link = location.origin + location.pathname + "?view=public&id="+uid;
  navigator.clipboard.writeText(link);
  alert("Link disalin:\n"+link);
};

/* LOAD PRODUK */
function loadProduk(){
  let id = isPublic ? new URLSearchParams(location.search).get("id") : uid;

  onSnapshot(collection(db,"toko",id,"produk"), snap=>{
    list.innerHTML="";
    snap.forEach(d=>{
      let p=d.data();

      list.innerHTML+=`
      <div class="product">
      <img src="${p.foto}">
      <h4>${p.nama}</h4>
      <p>Rp ${p.harga}</p>
      <p>Stok: ${p.stok}</p>

      ${
        isPublic
        ? `<button onclick="addToCart('${p.nama}',${p.harga})">Tambah</button>`
        : `
        <button onclick="edit('${d.id}','${p.nama}',${p.harga},${p.stok})" class="btn-warning">Edit</button>
        <button onclick="hapus('${d.id}')" class="btn-danger">Hapus</button>
        `
      }

      </div>`;
    });
  });
}

/* CART */
window.addToCart=(n,h)=>{
  let i=cart.find(x=>x.nama===n);
  if(i)i.qty++;
  else cart.push({nama:n,harga:h,qty:1});
  renderCart();
};

function renderCart(){
  let html="", total=0;

  cart.forEach((i,x)=>{
    let sub=i.harga*i.qty;
    total+=sub;

    html+=`
    <div class="cart-item">
    ${i.nama} x${i.qty}
    <div>
    <button onclick="kurang(${x})">-</button>
    <button onclick="tambahQty(${x})">+</button>
    </div>
    </div>`;
  });

  cartList.innerHTML=html;
  totalHarga.innerText="Total: Rp "+total.toLocaleString();
}

window.tambahQty=i=>{cart[i].qty++;renderCart();}
window.kurang=i=>{cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); renderCart();}

/* CHECKOUT */
window.checkoutCart=()=>{
  let pesan="Halo saya mau beli:\n\n";
  let total=0;

  cart.forEach(i=>{
    let sub=i.harga*i.qty;
    total+=sub;
    pesan+=`${i.nama} x${i.qty} = Rp ${sub}\n`;
  });

  pesan+=`\nTotal: Rp ${total}`;

  window.open(`https://wa.me/${tokoData.noWA}?text=${encodeURIComponent(pesan)}`);
};

/* TAMBAH */
window.tambah=async()=>{
  let finalStok=+stok.value;
  if(satuan.value=="pack") finalStok=stok.value*(+pack.value||1);
  if(satuan.value=="crt") finalStok=stok.value*(+crt.value||1);

  let url="";
  if(foto.files[0]){
    let r=ref(storage,"produk/"+uid+Date.now());
    await uploadBytes(r,foto.files[0]);
    url=await getDownloadURL(r);
  }

  if(editId){
    await updateDoc(doc(db,"toko",uid,"produk",editId),{
      nama:nama.value,
      harga:+harga.value,
      stok:finalStok,
      ...(url && {foto:url})
    });
    editId=null;
  }else{
    await addDoc(collection(db,"toko",uid,"produk"),{
      nama:nama.value,
      harga:+harga.value,
      stok:finalStok,
      foto:url
    });
  }

  resetForm();
};

window.edit=(id,n,h,s)=>{
  editId=id;
  nama.value=n;
  harga.value=h;
  stok.value=s;
};

window.hapus=async(id)=>{
  if(confirm("Hapus produk?")){
    await deleteDoc(doc(db,"toko",uid,"produk",id));
  }
};

window.resetForm=()=>{
  document.querySelectorAll("input").forEach(i=>i.value="");
  preview.src="";
};

/* PREVIEW */
foto.onchange=()=>{
  if(foto.files[0]){
    preview.src=URL.createObjectURL(foto.files[0]);
  }
};
</script>

</body>
</html>
