<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVI STORE</title>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f8;}
.header{background:#25D366;color:white;padding:15px;text-align:center;font-weight:bold;}

.container{padding:10px;margin-bottom:80px;}
.hidden{display:none;}

input,select{
  width:100%;padding:10px;margin:5px 0;
  border-radius:8px;border:1px solid #ccc;
}

button{
  width:100%;padding:10px;margin:5px 0;
  border:none;border-radius:8px;
  background:#25D366;color:white;font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
}

.card{
  background:white;border-radius:12px;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{width:100%;height:140px;object-fit:cover;}
.card-body{padding:8px;}
.nama{font-size:14px;font-weight:bold;}
.harga{color:#25D366;font-weight:bold;}

.qty{display:flex;justify-content:space-between;align-items:center;}
.qty button{width:30px;height:30px;padding:0;}

.empty{
  text-align:center;
  color:#888;
  margin-top:50px;
}

.cart-box{
  position:fixed;bottom:60px;left:0;right:0;
  background:white;padding:10px;border-top:1px solid #ddd;
}

.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;background:white;border-top:1px solid #ccc;
}

.tab{
  flex:1;text-align:center;padding:10px;
  font-size:12px;
}

.tab.active{color:#25D366;font-weight:bold;}
</style>
</head>

<body>

<div class="header">EVI STORE</div>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Daftar</button>
</div>

<!-- INPUT -->
<div id="inputPage" class="hidden">
<h3>Tambah Produk</h3>
<input id="nama" placeholder="Nama Produk">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">

<select id="satuan">
<option>pcs</option>
<option>pack</option>
<option>crt</option>
</select>

<input type="file" id="foto">
<button onclick="upload()">Simpan Produk</button>
</div>

<!-- CATALOG -->
<div id="catalogPage" class="hidden">
<div id="loading">Loading...</div>
<div class="grid" id="catalog"></div>
<div class="empty hidden" id="empty">Belum ada produk</div>
</div>

<!-- ACCOUNT -->
<div id="accountPage" class="hidden">
<h3>Akun</h3>
<div id="userInfo"></div>
<button onclick="logout()">Logout</button>
</div>

</div>

<!-- CART -->
<div class="cart-box hidden" id="cartBox">
<div id="cart"></div>
<button onclick="checkout()">Checkout WhatsApp</button>
</div>

<!-- TAB MENU -->
<div class="tabbar hidden" id="tabbar">
<div class="tab" onclick="show('catalog')">Home</div>
<div class="tab" onclick="show('catalog')">Catalog</div>
<div class="tab" onclick="show('input')">Input</div>
<div class="tab" onclick="show('account')">Akun</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.firebasestorage.app",
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let user=null;
let cartData={};

// AUTH
onAuthStateChanged(auth,(u)=>{
  user=u;
  if(u){
    tabbar.classList.remove("hidden");
    show("catalog");
    userInfo.innerHTML = "Login: "+u.email;
  }else{
    tabbar.classList.add("hidden");
    show("login");
  }
});

// NAV
window.show=(page)=>{
  loginPage.classList.add("hidden");
  inputPage.classList.add("hidden");
  catalogPage.classList.add("hidden");
  accountPage.classList.add("hidden");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

  if(page=="login"){
    loginPage.classList.remove("hidden");
  }
  if(page=="input"){
    inputPage.classList.remove("hidden");
  }
  if(page=="catalog"){
    catalogPage.classList.remove("hidden");
    loadCatalog();
  }
  if(page=="account"){
    accountPage.classList.remove("hidden");
  }
};

// AUTH
window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value);
window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value);
window.logout=()=>signOut(auth);

// UPLOAD
window.upload=async()=>{
  const file=foto.files[0];
  if(!file) return alert("Pilih foto");

  const storageRef=ref(storage,"produk/"+Date.now());
  await uploadBytes(storageRef,file);
  const url=await getDownloadURL(storageRef);

  await addDoc(collection(db,"produk"),{
    nama:nama.value,
    harga:Number(harga.value),
    stok:Number(stok.value),
    satuan:satuan.value,
    foto:url,
    userId:user.uid
  });

  alert("Produk berhasil ditambahkan");
};

// LOAD CATALOG
async function loadCatalog(){
  loading.style.display="block";
  empty.classList.add("hidden");
  catalog.innerHTML="";

  const snap=await getDocs(collection(db,"produk"));

  loading.style.display="none";

  if(snap.empty){
    empty.classList.remove("hidden");
    return;
  }

  let html="";
  snap.forEach(doc=>{
    const p=doc.data();
    const id=doc.id;

    html+=`
    <div class="card">
      <img src="${p.foto}">
      <div class="card-body">
        <div class="nama">${p.nama}</div>
        <div class="harga">Rp ${p.harga}</div>

        <div class="qty">
          <button onclick="min('${id}')">-</button>
          <span id="q_${id}">0</span>
          <button onclick="add('${id}','${p.nama}',${p.harga})">+</button>
        </div>
      </div>
    </div>`;
  });

  catalog.innerHTML=html;
  cartBox.classList.remove("hidden");
}

// CART
window.add=(id,nama,harga)=>{
  if(!cartData[id]) cartData[id]={nama,qty:0,harga};
  cartData[id].qty++;
  updateCart();
};

window.min=(id)=>{
  if(cartData[id]){
    cartData[id].qty--;
    if(cartData[id].qty<=0) delete cartData[id];
  }
  updateCart();
};

function updateCart(){
  let html="",total=0;

  for(let id in cartData){
    let i=cartData[id];
    total+=i.qty*i.harga;

    let el=document.getElementById("q_"+id);
    if(el) el.innerText=i.qty;

    html+=`${i.nama} x${i.qty}<br>`;
  }

  html+=`<hr>Total: Rp ${total}`;
  cart.innerHTML=html;
}

// CHECKOUT
window.checkout=()=>{
  let text="Pesanan:%0A";

  for(let id in cartData){
    let i=cartData[id];
    text+=`${i.nama} x${i.qty}%0A`;
  }

  let wa="6282285712293";
  window.open(`https://wa.me/${wa}?text=${text}`);
};
</script>

</body>
</html>
