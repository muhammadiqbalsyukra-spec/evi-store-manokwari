<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog Pro UI</title>

<style>
body{
  font-family:sans-serif;
  margin:0;
  background:#f1f3f6;
}

.header{
  background:#28a745;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container{padding:15px;}

.hidden{display:none;}

input,select{
  padding:10px;
  margin:5px 0;
  width:100%;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  margin:5px 0;
  background:#28a745;
  color:white;
  width:100%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.card{
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
}

.price{color:#28a745;font-weight:bold;}

.qty{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:5px;
}

.qty button{
  width:30px;
  height:30px;
  padding:0;
}

.cartBox{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">Catalog Toko</div>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<input type="password" id="pass" placeholder="Password admin">
<button onclick="login()">Login</button>
</div>

<!-- INPUT -->
<div id="inputPage" class="hidden">
<h3>Tambah Produk</h3>

<input id="nama" placeholder="Nama">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">

<select id="satuan">
<option>pcs</option>
<option>pack</option>
<option>crt</option>
</select>

<input type="file" id="foto">

<button onclick="upload()">Simpan</button>
<button onclick="goCatalog()">Lihat Catalog</button>
<button onclick="logout()">Logout</button>
</div>

<!-- CATALOG -->
<div id="catalogPage" class="hidden">
<div class="grid" id="catalog"></div>

<div class="cartBox">
<h4>Keranjang</h4>
<div id="cart"></div>
<button onclick="checkout()">Checkout WhatsApp</button>
</div>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.firebasestorage.app",
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const storage = firebase.storage();

// NAV
function show(){
  let h = location.hash || "#catalog";

  loginPage.classList.add("hidden");
  inputPage.classList.add("hidden");
  catalogPage.classList.add("hidden");

  if(h=="#login"){
    loginPage.classList.remove("hidden");
  }else if(h=="#input"){
    if(localStorage.login=="true"){
      inputPage.classList.remove("hidden");
    }else location.hash="#login";
  }else{
    catalogPage.classList.remove("hidden");
    loadCatalog();
  }
}
window.onload=show;
window.onhashchange=show;

// LOGIN
function login(){
  if(pass.value=="12345"){
    localStorage.login="true";
    location.hash="#input";
  }
}
function logout(){
  localStorage.removeItem("login");
  location.hash="#login";
}

// UPLOAD PRODUK (LEBIH RINGAN)
async function upload(){
  const file = foto.files[0];

  const ref = storage.ref("produk/"+Date.now());
  await ref.put(file);

  const url = await ref.getDownloadURL();

  await db.collection("produk").add({
    nama:nama.value,
    harga:harga.value,
    stok:stok.value,
    satuan:satuan.value,
    foto:url
  });

  alert("Berhasil upload!");
}

// LOAD CATALOG
let cartData = {};

async function loadCatalog(){
  const snap = await db.collection("produk").get();
  let html="";

  snap.forEach(doc=>{
    const id = doc.id;
    const p = doc.data();

    html += `
    <div class="card">
      <img src="${p.foto}">
      <div>${p.nama}</div>
      <div class="price">Rp ${p.harga}</div>

      <div class="qty">
        <button onclick="min('${id}')">-</button>
        <span id="q_${id}">0</span>
        <button onclick="add('${id}','${p.nama}',${p.harga})">+</button>
      </div>
    </div>`;
  });

  catalog.innerHTML = html;
}

// CART
function add(id,nama,harga){
  if(!cartData[id]) cartData[id]={nama,qty:0,harga};
  cartData[id].qty++;
  updateCart();
}

function min(id){
  if(cartData[id]){
    cartData[id].qty--;
    if(cartData[id].qty<=0) delete cartData[id];
  }
  updateCart();
}

function updateCart(){
  let html="", total=0;

  for(let id in cartData){
    let i = cartData[id];
    total += i.qty*i.harga;
    document.getElementById("q_"+id).innerText=i.qty;
    html += `${i.nama} x${i.qty}<br>`;
  }

  html += `<hr>Total: Rp ${total}`;
  cart.innerHTML = html;
}

// CHECKOUT WA
function checkout(){
  let text="Pesanan:%0A";

  for(let id in cartData){
    let i = cartData[id];
    text += `${i.nama} x${i.qty}%0A`;
  }

  let wa="6282285712293"; // GANTI
  window.open(`https://wa.me/${wa}?text=${text}`);
}
</script>

</body>
</html>
