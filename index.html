<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVI STORE MANOKWARI</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.appspot.com", // ⚠️ ini harus .appspot.com
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
};

/* INIT */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* AMBIL ELEMENT */
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const loginBox = document.getElementById("loginBox");
const appBox = document.getElementById("appBox");
const list = document.getElementById("list");

/* LOGIN */
window.login = async () => {
  try {
    await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
  } catch (e) {
    alert("Login gagal: " + e.message);
  }
};

/* AUTO LOGIN */
onAuthStateChanged(auth, user => {
  if(user){
    loginBox.style.display="none";
    appBox.style.display="block";
    loadProduk();
  }
});

/* LOAD PRODUK */
function loadProduk(){
  onSnapshot(collection(db,"produk"), snap=>{
    list.innerHTML="";
    snap.forEach(doc=>{
      let p = doc.data();

      list.innerHTML += `
      <div class="product">
        <img src="${p.foto}">
        <h4>${p.nama}</h4>
        <p>Rp ${p.harga}</p>
        <p>Stok: ${p.stok} PCS</p>
        <button onclick="checkout('${p.nama}',${p.harga})">
        Beli via WA
        </button>
      </div>`;
    });
  });
}

/* TAMBAH PRODUK */
window.tambah = async () => {
  const file = document.getElementById("foto").files[0];

  if(!file) return alert("Foto wajib!");

  const storageRef = ref(storage, "produk/"+Date.now()+"_"+file.name);
  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);

  await addDoc(collection(db,"produk"),{
    nama: document.getElementById("nama").value,
    harga: +document.getElementById("harga").value,
    stok: +document.getElementById("stok").value,
    pack: +document.getElementById("pack").value || 1,
    crt: +document.getElementById("crt").value || 1,
    foto: url
  });

  alert("Produk ditambahkan!");
};

/* CHECKOUT WA */
window.checkout = (nama, harga) => {
  let pesan = `Halo, saya mau beli ${nama} harga Rp${harga}`;
  let no = "6282285712293";
  window.open(`https://wa.me/${no}?text=${encodeURIComponent(pesan)}`);
};

</script>

<style>
body { font-family:sans-serif; background:#f4f6fb; }
.navbar { background:#1e88e5; color:white; padding:15px; text-align:center; }
.container { padding:15px; }
.card { background:white; padding:15px; border-radius:12px; margin-bottom:15px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:15px; }
.product { background:white; padding:10px; border-radius:10px; text-align:center; }
.product img { width:100%; height:130px; object-fit:cover; }
button { background:#1e88e5; color:white; border:none; padding:8px; border-radius:6px; }
</style>
</head>

<body>

<div class="navbar">EVI STORE MANOKWARI</div>

<div class="container">

<div class="card" id="loginBox">
  <h3>Login Admin</h3>
  <input id="emailInput" placeholder="Email">
  <input id="passwordInput" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="appBox" style="display:none">

<div class="card">
<h3>Tambah Produk</h3>
<input id="nama" placeholder="Nama">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">
<input id="pack" type="number" placeholder="1 Pack = PCS">
<input id="crt" type="number" placeholder="1 CRT = PCS">
<input type="file" id="foto">
<button onclick="tambah()">Simpan</button>
</div>

<h3>Catalog Produk</h3>
<div id="list" class="grid"></div>

</div>

</div>

</body>
</html>
