<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVI STORE MANOKWARI</title><style>
body {font-family:sans-serif;background:#f4f6fb;margin:0;}
.navbar {background:#1e88e5;color:#fff;padding:15px;text-align:center;font-weight:bold;}
.container {padding:15px;max-width:900px;margin:auto;}
.card {background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;}

input,select,button{
width:100%;padding:10px;margin:5px 0;border-radius:6px;border:1px solid #ccc;
}

button{background:#1e88e5;color:white;border:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}

.product{background:#fff;padding:10px;border-radius:8px;text-align:center;}
.product img{width:100%;height:120px;object-fit:cover;border-radius:6px;}

.preview{
width:100%;
max-height:200px;
object-fit:contain;
background:#eee;
margin-top:5px;
}
</style></head><body><div class="navbar">EVI STORE MANOKWARI</div><div class="container"><div class="card" id="loginBox">
<h3>Login Admin</h3>
<input id="email">
<input id="password" type="password">
<button onclick="login()">Login</button>
</div><div id="appBox" style="display:none"><div class="card">
<h3>Tambah Produk</h3><input id="nama" placeholder="Nama">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok"><select id="satuan">
<option value="pcs">PCS</option>
<option value="pack">PACK</option>
<option value="crt">CRT</option>
</select><input id="pack" placeholder="1 Pack = PCS">
<input id="crt" placeholder="1 CRT = PCS"><input type="file" id="foto">
<img id="preview" class="preview"><button onclick="tambah()">Simpan Produk</button>

</div><div class="card">
<h3>Catalog Produk</h3>
<div id="list" class="grid"></div>
</div></div>
</div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.appspot.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* LOGIN */
window.login = async ()=>{
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
  }catch(e){
    alert("Login gagal!");
  }
};

/* AUTO LOGIN */
onAuthStateChanged(auth,u=>{
  if(u){
    loginBox.style.display="none";
    appBox.style.display="block";
    load();
  }
});

/* PREVIEW */
foto.onchange = ()=>{
  let f = foto.files[0];
  if(f){
    preview.src = URL.createObjectURL(f);
  }
};

/* LOAD DATA */
function load(){
  onSnapshot(collection(db,"produk"), snap=>{
    list.innerHTML="";
    snap.forEach(d=>{
      let p=d.data();
      list.innerHTML+=`
      <div class="product">
      <img src="${p.foto}">
      <h4>${p.nama}</h4>
      <p>Rp ${p.harga}</p>
      <p>Stok: ${p.stok}</p>
      </div>`;
    });
  });
}

/* SIMPAN PRODUK */
window.tambah = async ()=>{
  try{

    if(!foto.files[0]) return alert("Foto wajib!");

    let namaVal = nama.value;
    let hargaVal = +harga.value;
    let stokVal = +stok.value;
    let satuanVal = satuan.value;
    let packVal = +pack.value || 1;
    let crtVal = +crt.value || 1;

    if(!namaVal || !hargaVal || !stokVal){
      return alert("Isi data dulu!");
    }

    let finalStok = stokVal;
    if(satuanVal=="pack") finalStok = stokVal*packVal;
    if(satuanVal=="crt") finalStok = stokVal*crtVal;

    let file = foto.files[0];
    let path = "produk/"+Date.now()+"_"+file.name;

    let storageRef = ref(storage,path);
    await uploadBytes(storageRef,file);
    let url = await getDownloadURL(storageRef);

    await addDoc(collection(db,"produk"),{
      nama:namaVal,
      harga:hargaVal,
      stok:finalStok,
      foto:url
    });

    alert("Berhasil simpan!");

    document.querySelectorAll("input").forEach(i=>i.value="");
    preview.src="";

  }catch(e){
    alert("ERROR: "+e.message);
    console.log(e);
  }
};

</script></body>
</html>
