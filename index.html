<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVI STORE</title>

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;}
.header{background:#25D366;color:white;padding:15px;text-align:center;font-weight:bold;}
.container{padding:15px;}
.hidden{display:none;}

input,button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  background:#25D366;
  color:white;
  font-weight:bold;
  border:none;
  cursor:pointer;
}

.menu{display:flex;gap:10px;}
.menu button{flex:1;}

#catalog{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

@media(max-width:768px){
  #catalog{grid-template-columns:repeat(2,1fr);}
}

.card{
  background:white;
  padding:10px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  text-align:center;
}

.card img{
  width:100%;
  height:140px;
  object-fit:contain;
  background:#fff;
  padding:5px;
}

.qty{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:8px;
}

.qty button{
  width:30px;
  height:30px;
}

.cart-box{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">EVI STORE</div>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button onclick="register()">DAFTAR</button>
</div>

<!-- INPUT -->
<div id="inputPage" class="hidden">
<h3>Menu Input</h3>

<input id="nama" placeholder="Nama Produk">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">
<input type="file" id="foto">

<button onclick="upload()">Simpan Produk</button>

<div class="menu">
<button onclick="showCatalog()">CATALOG</button>
<button onclick="shareCatalog()">SHARE CATALOG</button>
<button onclick="logout()">LOGOUT</button>
</div>

<div id="notif"></div>
</div>

<!-- CATALOG -->
<div id="catalogPage" class="hidden">

<h3>Catalog</h3>
<button onclick="backToInput()">⬅ Kembali</button>

<div id="catalog"></div>

<h3>Keranjang</h3>
<div id="cart" class="cart-box"></div>

<div class="menu">
<button onclick="checkout()">CHECKOUT</button>
<button onclick="shareWA()">ORDER WA</button>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.firebasestorage.app",
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
});

const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let cartData={};

/* MODE PUBLIC */
const params = new URLSearchParams(location.search);
const isPublic = params.get("user") === "public";

if(isPublic){
  loginPage.classList.add("hidden");
  inputPage.classList.add("hidden");
  catalogPage.classList.remove("hidden");
}

/* AUTH */
onAuthStateChanged(auth,(u)=>{
  if(isPublic) return;

  if(u){
    loginPage.classList.add("hidden");
    inputPage.classList.remove("hidden");
  }else{
    loginPage.classList.remove("hidden");
    inputPage.classList.add("hidden");
    catalogPage.classList.add("hidden");
  }
});

window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));

window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));

window.logout=()=>signOut(auth);

/* SHARE LINK */
window.shareCatalog=()=>{
  let link = location.origin + location.pathname + "?user=public";
  navigator.clipboard.writeText(link);
  alert("Link catalog disalin:\n"+link);
};

/* UPLOAD */
window.upload=async()=>{
  if(!foto.files[0]) return alert("Pilih foto");

  notif.innerHTML="Uploading...";

  const file=foto.files[0];
  const storageRef=ref(storage,"produk/"+Date.now());

  await uploadBytes(storageRef,file);
  const url=await getDownloadURL(storageRef);

  await addDoc(collection(db,"produk"),{
    nama:nama.value,
    harga:+harga.value,
    stok:+stok.value,
    foto:url
  });

  notif.innerHTML="✅ Berhasil";

  nama.value="";
  harga.value="";
  stok.value="";
  foto.value="";
};

/* NAV */
window.showCatalog=()=>{
  inputPage.classList.add("hidden");
  catalogPage.classList.remove("hidden");
};

window.backToInput=()=>{
  catalogPage.classList.add("hidden");
  inputPage.classList.remove("hidden");
};

/* REALTIME */
onSnapshot(collection(db,"produk"),(snap)=>{
  let html="";

  snap.forEach(docSnap=>{
    const p=docSnap.data();
    const id=docSnap.id;

    html+=`
    <div class="card">
      <img src="${p.foto}">
      <b>${p.nama}</b><br>
      Rp ${p.harga}<br>
      <small>Stok: ${p.stok}</small>

      <div class="qty">
        <button onclick="min('${id}')">-</button>
        <span id="q_${id}">0</span>
        <button onclick="add('${id}','${p.nama}',${p.harga},${p.stok})">+</button>
      </div>

      ${!isPublic ? `
      <div style="margin-top:8px;">
        <button onclick="editProduk('${id}','${p.nama}',${p.harga},${p.stok})">✏️</button>
        <button onclick="hapusProduk('${id}')">🗑️</button>
      </div>` : ``}

    </div>`;
  });

  catalog.innerHTML=html;
});

/* EDIT */
window.editProduk=async(id,nama,harga,stok)=>{
  let n = prompt("Nama:", nama);
  if(n===null) return;

  let h = prompt("Harga:", harga);
  if(h===null) return;

  let s = prompt("Stok:", stok);
  if(s===null) return;

  await updateDoc(doc(db,"produk",id),{
    nama:n,
    harga:+h,
    stok:+s
  });

  alert("Produk diupdate");
};

/* HAPUS */
window.hapusProduk=async(id)=>{
  if(!confirm("Yakin hapus produk?")) return;
  await deleteDoc(doc(db,"produk",id));
  alert("Produk dihapus");
};

/* CART */
window.add=(id,nama,harga,stok)=>{
  if(!cartData[id]) cartData[id]={nama,qty:0,harga,stok};
  if(cartData[id].qty>=stok) return alert("Stok habis");
  cartData[id].qty++;
  updateCart();
};

window.min=(id)=>{
  if(cartData[id]){
    cartData[id].qty--;
    if(cartData[id].qty<=0) delete cartData[id];
  }
  updateCart();
};

function updateCart(){
  let html="",total=0;

  for(let id in cartData){
    let i=cartData[id];
    let sub=i.qty*i.harga;
    total+=sub;

    let el=document.getElementById("q_"+id);
    if(el) el.innerText=i.qty;

    html+=`- ${i.nama} x${i.qty} = Rp ${sub}<br>`;
  }

  html+=`<hr><b>Total: Rp ${total}</b>`;
  cart.innerHTML=html;
}

/* CHECKOUT */
window.checkout=async()=>{
  if(Object.keys(cartData).length===0){
    return alert("Keranjang kosong");
  }

  for(let id in cartData){
    let i=cartData[id];

    await updateDoc(doc(db,"produk",id),{
      stok:i.stok-i.qty
    });
  }

  alert("Checkout berhasil");

  cartData={};
  updateCart();
};

/* SHARE WA */
window.shareWA=()=>{
  if(Object.keys(cartData).length===0){
    return alert("Keranjang kosong");
  }

  let total=0;
  let text="Pesanan:%0A";

  for(let id in cartData){
    let i=cartData[id];
    let sub=i.qty*i.harga;
    total+=sub;

    text+=`${i.nama} x${i.qty} = Rp ${sub}%0A`;
  }

  text+=`Total: Rp ${total}`;

  window.open(`https://wa.me/6282285712293?text=${text}`);
};
</script>

</body>
</html>
