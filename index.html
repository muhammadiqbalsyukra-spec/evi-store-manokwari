<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVI STORE</title>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f8;}
.header{
  background:#25D366;
  color:white;
  padding:15px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.container{padding:10px;}

.hidden{display:none;}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  margin:5px 0;
  width:100%;
  background:#25D366;
  color:white;
  font-weight:bold;
}

/* GRID CATALOG */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.card-body{padding:8px;}

.nama{font-size:14px;font-weight:bold;}
.harga{color:#25D366;font-weight:bold;}

.qty{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:5px;
}

.qty button{
  width:30px;height:30px;padding:0;
}

/* CART FIXED */
.cart-box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  border-top:1px solid #ddd;
}

.total{font-weight:bold;color:#25D366;}
</style>
</head>

<body>

<div class="header">
<span>EVI STORE</span>
<span onclick="goCatalog()">🛍️</span>
</div>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Daftar</button>
</div>

<!-- INPUT -->
<div id="inputPage" class="hidden">
<h3>Tambah Produk</h3>

<input id="nama" placeholder="Nama Produk">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">

<select id="satuan">
<option>pcs</option>
<option>pack</option>
<option>crt</option>
</select>

<input type="file" id="foto">

<button onclick="upload()">Simpan Produk</button>
<button onclick="logout()">Logout</button>
</div>

<!-- CATALOG -->
<div id="catalogPage" class="hidden">
<div class="grid" id="catalog"></div>
</div>

<!-- CART -->
<div class="cart-box" id="cartBox">
<div id="cart"></div>
<button onclick="checkout()">Checkout WhatsApp</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.firebasestorage.app",
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let user=null;
let cartData={};

// AUTH
onAuthStateChanged(auth,(u)=>{
  user=u;
  if(u){
    show("#catalog");
  }else{
    show("#login");
  }
});

// NAV
function show(p){
  loginPage.classList.add("hidden");
  inputPage.classList.add("hidden");
  catalogPage.classList.add("hidden");

  if(p=="#login") loginPage.classList.remove("hidden");
  if(p=="#input") inputPage.classList.remove("hidden");
  if(p=="#catalog"){
    catalogPage.classList.remove("hidden");
    loadCatalog();
  }
}

window.goCatalog=()=>show("#catalog");

// AUTH FUNC
window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value);
window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value);
window.logout=()=>signOut(auth);

// UPLOAD
window.upload=async()=>{
  const file=foto.files[0];
  if(!file) return alert("Pilih foto");

  const storageRef=ref(storage,"produk/"+Date.now());
  await uploadBytes(storageRef,file);
  const url=await getDownloadURL(storageRef);

  await addDoc(collection(db,"produk"),{
    nama:nama.value,
    harga:Number(harga.value),
    stok:Number(stok.value),
    satuan:satuan.value,
    foto:url,
    userId:user.uid
  });

  alert("Produk berhasil");
};

// LOAD CATALOG
async function loadCatalog(){
  const snap=await getDocs(collection(db,"produk"));
  let html="";

  snap.forEach(doc=>{
    const p=doc.data();
    const id=doc.id;

    html+=`
    <div class="card">
      <img src="${p.foto}">
      <div class="card-body">
        <div class="nama">${p.nama}</div>
        <div class="harga">Rp ${p.harga}</div>

        <div class="qty">
          <button onclick="min('${id}')">-</button>
          <span id="q_${id}">0</span>
          <button onclick="add('${id}','${p.nama}',${p.harga})">+</button>
        </div>
      </div>
    </div>`;
  });

  catalog.innerHTML=html;
}

// CART
window.add=(id,nama,harga)=>{
  if(!cartData[id]) cartData[id]={nama,qty:0,harga};
  cartData[id].qty++;
  updateCart();
};

window.min=(id)=>{
  if(cartData[id]){
    cartData[id].qty--;
    if(cartData[id].qty<=0) delete cartData[id];
  }
  updateCart();
};

function updateCart(){
  let html="",total=0;

  for(let id in cartData){
    let i=cartData[id];
    total+=i.qty*i.harga;

    let el=document.getElementById("q_"+id);
    if(el) el.innerText=i.qty;

    html+=`${i.nama} x${i.qty}<br>`;
  }

  html+=`<hr><div class="total">Total: Rp ${total}</div>`;
  cart.innerHTML=html;
}

// CHECKOUT
window.checkout=()=>{
  let text="*Pesanan EVI STORE*%0A";

  for(let id in cartData){
    let i=cartData[id];
    text+=`${i.nama} x${i.qty}%0A`;
  }

  let wa="628XXXXXXXXXX";
  window.open(`https://wa.me/${wa}?text=${text}`);
};
</script>

</body>
</html>
