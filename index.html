<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWy6VGNZCzqFJ4v9dw1Ur8zY9F7-rcuyc",
  authDomain: "evi-store-manokwari.firebaseapp.com",
  projectId: "evi-store-manokwari",
  storageBucket: "evi-store-manokwari.firebasestorage.app",
  messagingSenderId: "630399354196",
  appId: "1:630399354196:web:78cecc396191345ebff4c1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* STATE */
let uid=null;
let editId=null;
let cart=[];
let tokoData=null;

/* PARAM */
const params = new URLSearchParams(location.search);
const isPublic = params.get("view")==="public";
const publicId = params.get("id");

/* ================= PUBLIC MODE ================= */
if(isPublic && publicId){
  loginBox.style.display="none";
  appBox.style.display="block";

  // sembunyikan form
  document.querySelectorAll("#appBox .card")[0].style.display="none";

  initPublic();
}

async function initPublic(){
  let snap = await getDoc(doc(db,"toko",publicId));
  tokoData = snap.data();

  judulToko.innerText = tokoData.namaToko;

  loadProduk(publicId);
}

/* ================= UI ================= */
window.showRegister=()=>{
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
};

window.showLogin=()=>{
  registerBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
};

/* ================= REGISTER ================= */
window.register = async ()=>{
  try{
    let u = await createUserWithEmailAndPassword(auth,regEmail.value,regPassword.value);
    uid = u.user.uid;

    await setDoc(doc(db,"toko",uid),{
      namaToko: regNamaToko.value,
      noWA: regWA.value,
      owner: regEmail.value
    });

    alert("Berhasil daftar!");
    showLogin();

  }catch(e){
    alert(e.message);
  }
};

/* ================= LOGIN ================= */
window.login = async ()=>{
  try{
    let u = await signInWithEmailAndPassword(auth,email.value,password.value);
    uid = u.user.uid;

    loginBox.style.display="none";
    appBox.style.display="block";

    await initToko();
    loadProduk(uid);

  }catch(e){
    alert("Login gagal: "+e.message);
  }
};

/* ================= LOGOUT ================= */
window.logout = async ()=>{
  await signOut(auth);
  location.reload();
};

/* ================= INIT TOKO ================= */
async function initToko(){
  let snap = await getDoc(doc(db,"toko",uid));
  tokoData = snap.data();

  namaToko.value = tokoData.namaToko;
  noWA.value = tokoData.noWA;
  judulToko.innerText = tokoData.namaToko;
}

/* ================= SIMPAN TOKO ================= */
window.simpanToko = async ()=>{
  await updateDoc(doc(db,"toko",uid),{
    namaToko:namaToko.value,
    noWA:noWA.value
  });
  alert("Tersimpan");
};

/* ================= SHARE ================= */
window.shareCatalog=()=>{
  let link = location.origin + location.pathname + `?view=public&id=${uid}`;
  navigator.clipboard.writeText(link);
  alert("Link katalog:\n"+link);
};

/* ================= LOAD PRODUK ================= */
function loadProduk(id){
  onSnapshot(collection(db,"toko",id,"produk"), snap=>{
    list.innerHTML="";
    snap.forEach(d=>{
      let p=d.data();

      list.innerHTML+=`
      <div class="product">
      <img src="${p.foto}">
      <h4>${p.nama}</h4>
      <p>Rp ${p.harga}</p>
      <p>Stok: ${p.stok}</p>

      ${
        isPublic
        ? `<button onclick="addToCart('${p.nama}',${p.harga})">Tambah</button>`
        : `
        <button onclick="edit('${d.id}','${p.nama}',${p.harga},${p.stok})">Edit</button>
        <button onclick="hapus('${d.id}')" class="btn-danger">Hapus</button>
        `
      }

      </div>`;
    });
  });
}

/* ================= CART ================= */
window.addToCart=(n,h)=>{
  let i=cart.find(x=>x.nama===n);
  if(i)i.qty++;
  else cart.push({nama:n,harga:h,qty:1});
  renderCart();
};

function renderCart(){
  let html="", total=0;

  cart.forEach((i,x)=>{
    let sub=i.harga*i.qty;
    total+=sub;

    html+=`
    <div class="cart-item">
    ${i.nama} x${i.qty}
    <div>
    <button onclick="kurang(${x})">-</button>
    <button onclick="tambahQty(${x})">+</button>
    </div>
    </div>`;
  });

  cartList.innerHTML=html;
  totalHarga.innerText="Total: Rp "+total.toLocaleString();
}

window.tambahQty=i=>{cart[i].qty++;renderCart();}
window.kurang=i=>{cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); renderCart();}

/* ================= CHECKOUT ================= */
window.checkoutCart=()=>{
  let pesan="Halo saya mau beli:\n\n";
  let total=0;

  cart.forEach(i=>{
    let sub=i.harga*i.qty;
    total+=sub;
    pesan+=`${i.nama} x${i.qty} = Rp ${sub}\n`;
  });

  pesan+=`\nTotal: Rp ${total}`;

  window.open(`https://wa.me/${tokoData.noWA}?text=${encodeURIComponent(pesan)}`);
};

/* ================= TAMBAH PRODUK (FAST) ================= */
window.tambah=async()=>{
  let btn = event.target;
  btn.disabled = true;
  btn.innerText = "Menyimpan...";

  try{
    let finalStok=+stok.value;
    if(satuan.value=="pack") finalStok=stok.value*(+pack.value||1);
    if(satuan.value=="crt") finalStok=stok.value*(+crt.value||1);

    let url="";
    if(foto.files[0]){
      let r=ref(storage,"produk/"+uid+"_"+Date.now());
      await uploadBytes(r,foto.files[0]);
      url=await getDownloadURL(r);
    }

    if(editId){
      await updateDoc(doc(db,"toko",uid,"produk",editId),{
        nama:nama.value,
        harga:+harga.value,
        stok:finalStok,
        ...(url && {foto:url})
      });
      editId=null;
    }else{
      await addDoc(collection(db,"toko",uid,"produk"),{
        nama:nama.value,
        harga:+harga.value,
        stok:finalStok,
        foto:url
      });
    }

    resetForm();

  }catch(e){
    alert("Error: "+e.message);
  }

  btn.disabled = false;
  btn.innerText = "Simpan Produk";
};

/* ================= EDIT ================= */
window.edit=(id,n,h,s)=>{
  editId=id;
  nama.value=n;
  harga.value=h;
  stok.value=s;
};

/* ================= HAPUS ================= */
window.hapus=async(id)=>{
  if(confirm("Hapus produk?")){
    await deleteDoc(doc(db,"toko",uid,"produk",id));
  }
};

/* ================= RESET ================= */
window.resetForm=()=>{
  document.querySelectorAll("input").forEach(i=>i.value="");
  preview.src="";
};

/* ================= PREVIEW ================= */
foto.onchange=()=>{
  if(foto.files[0]){
    preview.src=URL.createObjectURL(foto.files[0]);
  }
};
</script>
